# ~/.tmux.conf — VS Code–style tmux (no prefix, direct keys)
# Target: macOS, standalone terminal (Ghostty / kitty / WezTerm / iTerm2)
# Requires tmux 3.5+ for the Ctrl+Shift bindings.

# ─────────────────────────────────────────────────────────────
# 0. Extended keys — REQUIRED for Ctrl+Shift+<key> to reach tmux
# ─────────────────────────────────────────────────────────────
# Without this, your terminal collapses Ctrl+Shift+P into plain Ctrl+P and
# tmux never sees the Shift. "always" tells tmux to also forward the extended
# sequences to programs running inside panes.
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'screen*:extkeys'

# OSC 52 clipboard: tmux only emits the escape when the client terminal
# advertises the Ms capability. Auto-added for xterm*, stated explicitly here
# so it also holds for screen*/tmux* clients (SSHing in from a local tmux).
set -as terminal-features 'xterm*:clipboard'
set -as terminal-features 'screen*:clipboard'
set -as terminal-features 'tmux*:clipboard'

# Truecolor + fast escape handling
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'
set -s escape-time 0
set -g focus-events on

# ─────────────────────────────────────────────────────────────
# 1. Sane defaults
# ─────────────────────────────────────────────────────────────
set -g mouse on                 # click panes, drag borders, scroll
set -g base-index 1             # windows start at 1, like VS Code tabs
setw -g pane-base-index 1
set -g renumber-windows on      # closing a tab renumbers the rest
set -g history-limit 50000

# Size each window to the client that used it LAST, not the smallest one
# attached. Without this, attaching from a phone shrinks the desktop layout to
# phone size and leaves it there — the default is `smallest`.
set -g window-size latest
set -g set-clipboard on
setw -g mode-keys vi
set -g status-position top      # tab bar on top, like VS Code

# ─────────────────────────────────────────────────────────────
# 2. Prefix — kept only as an escape hatch
# ─────────────────────────────────────────────────────────────
# You asked for no prefix, but keeping one costs nothing and saves you when a
# direct key gets swallowed. Ctrl+A is out of the way on macOS.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Cycle panes while STAYING zoomed — one fullscreen pane at a time, like tabs.
# select-pane unzooms on its own, so re-zoom after moving. Only when already
# zoomed, so unzoomed cycling still behaves normally.
# Prefix-based on purpose: Ctrl+Shift and Alt are painful on a phone keyboard,
# but Ctrl+A then a letter is easy.
bind o if -F '#{window_zoomed_flag}' 'select-pane -t :.+ ; resize-pane -Z' 'select-pane -t :.+'
bind O if -F '#{window_zoomed_flag}' 'select-pane -t :.- ; resize-pane -Z' 'select-pane -t :.-'
bind z resize-pane -Z

# ─────────────────────────────────────────────────────────────
# 3. Splits — Ctrl+\ and Ctrl+Shift+5
# ─────────────────────────────────────────────────────────────
# VS Code: Ctrl+\ splits the editor, Ctrl+Shift+5 splits the terminal.
bind -n 'C-\'   split-window -h -c "#{pane_current_path}"
bind -n 'C-S-5' split-window -h -c "#{pane_current_path}"
bind -n 'M-\'   split-window -v -c "#{pane_current_path}"   # Alt+\ = split down

# ─────────────────────────────────────────────────────────────
# 4. New / close — Ctrl+Shift+` and Ctrl+Shift+W
# ─────────────────────────────────────────────────────────────
bind -n 'C-S-`' new-window -c "#{pane_current_path}"
bind -n 'C-S-t' new-window -c "#{pane_current_path}"        # Ctrl+Shift+T, new tab
bind -n 'C-S-w' kill-pane                                   # close pane
bind -n 'C-S-q' kill-window                                 # close whole tab

# Ctrl+W is VS Code's real "close", but in a terminal Ctrl+W is
# backward-kill-word in readline/zsh/bash — binding it here breaks that
# everywhere. Uncomment only if you never use it.
# bind -n C-w kill-pane

# ─────────────────────────────────────────────────────────────
# 5. Tab switching — Ctrl+PageUp / Ctrl+PageDown, Alt+1..9
# ─────────────────────────────────────────────────────────────
bind -n C-PPage previous-window
bind -n C-NPage next-window
bind -n 'C-S-Tab' previous-window
bind -n 'C-Tab'   next-window

# Alt+1..9 jumps to a tab. Alt is used rather than Ctrl because most terminals
# cannot encode Ctrl+<digit> distinctly — Ctrl+1 arrives as plain "1".
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Drag tabs left/right
bind -n 'C-S-PPage' swap-window -t -1 \; previous-window
bind -n 'C-S-NPage' swap-window -t +1 \; next-window

# ─────────────────────────────────────────────────────────────
# 6. Pane focus — Alt+hjkl, with Neovim passthrough
# ─────────────────────────────────────────────────────────────
# The problem: `bind -n` bindings are swallowed by tmux and never reach the
# program in the pane. So a naive config makes Neovim unable to see Alt+h,
# Ctrl+Shift+P, Ctrl+Shift+F — the exact keys an editor wants most.
#
# The fix: check what's actually running in the focused pane. If it's Vim or
# Neovim, forward the key instead of acting on it. Neovim then decides whether
# to move between its own splits or hand the move back to tmux (that's what
# vim-tmux-navigator does).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?$'"

bind -n M-h if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind -n M-j if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind -n M-k if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind -n M-l if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

# Alt+arrows are deliberately NOT bound to pane movement — Neovim uses
# Alt+Up/Down to move lines, which is VS Code behaviour worth keeping.
# Use Alt+hjkl for panes.

# Copy-mode needs its own copies of these
bind -T copy-mode-vi M-h select-pane -L
bind -T copy-mode-vi M-j select-pane -D
bind -T copy-mode-vi M-k select-pane -U
bind -T copy-mode-vi M-l select-pane -R

# ─────────────────────────────────────────────────────────────
# 7. Pane resize — Ctrl+Shift+arrows  (VS Code exactly)
# ─────────────────────────────────────────────────────────────
bind -n 'C-S-Left'  resize-pane -L 3
bind -n 'C-S-Right' resize-pane -R 3
bind -n 'C-S-Up'    resize-pane -U 2
bind -n 'C-S-Down'  resize-pane -D 2

# Maximize / restore the focused pane — VS Code's Ctrl+Shift+Enter-ish "maximize"
bind -n 'C-S-Enter' resize-pane -Z
bind -n 'M-Enter'   resize-pane -Z

# ─────────────────────────────────────────────────────────────
# 8. Command palette & quick open
# ─────────────────────────────────────────────────────────────
# These three are editor concepts first. When Neovim has the pane they go to
# Neovim (command palette / file explorer / search-in-files); otherwise tmux
# handles them (command prompt / pane switcher / scrollback search).
bind -n 'C-S-p' if-shell "$is_vim" 'send-keys C-S-p' 'command-prompt'
bind -n 'C-S-e' if-shell "$is_vim" 'send-keys C-S-e' 'choose-tree -Zw'
bind -n 'C-S-f' if-shell "$is_vim" 'send-keys C-S-f' 'copy-mode ; send-keys ?'

# Ctrl+P (quick open) collides with readline's previous-history. Uncomment if
# you'd rather have the tab switcher.
# bind -n C-p choose-tree -Zw

# ─────────────────────────────────────────────────────────────
# 9. Scratch terminal — Ctrl+Space  (this is your Ctrl+` )
# ─────────────────────────────────────────────────────────────
# Important: nearly every terminal sends Ctrl+` as NUL, which is byte-identical
# to Ctrl+Space and Ctrl+@. tmux cannot tell them apart, so binding C-Space
# gives you Ctrl+` for free. A floating popup is the closest match to VS Code's
# toggling panel.
bind -n C-Space if-shell -F '#{==:#{session_name},_scratch}' \
  { detach-client } \
  { display-popup -E -w 80% -h 70% -d "#{pane_current_path}" \
    "tmux new-session -A -s _scratch" }

# ─────────────────────────────────────────────────────────────
# 10. Copy / paste — macOS
# ─────────────────────────────────────────────────────────────
bind -T copy-mode-vi v send -X begin-selection
# This tmux runs on the DEV SERVER, so pbcopy would write that machine's own
# clipboard — a clipboard nobody reads. copy-selection-and-cancel fills the tmux
# buffer and, because set-clipboard is on, also emits OSC 52 back to the
# attached terminal, which sets the real clipboard.
# Requires an OSC 52-capable terminal: iTerm2 with "Applications in terminal may
# access clipboard" enabled. Terminal.app does NOT support OSC 52.
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# Paste the tmux buffer. pbpaste would read the SERVER's clipboard; to paste
# text copied on your Mac use the terminal's own paste (Cmd+V) — OSC 52 cannot
# read the clipboard, only write it.
bind -n 'C-S-v' paste-buffer -p

# ─────────────────────────────────────────────────────────────
# 11. Reload
# ─────────────────────────────────────────────────────────────
bind -n 'C-S-r' source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ─────────────────────────────────────────────────────────────
# 12. Look — Monokai Pro (default filter)
# ─────────────────────────────────────────────────────────────
#   base ramp          accents
#   base1  #2D2A2E     red     #FF6188
#   base2  #221F22     orange  #FC9867
#   base3  #403E41     yellow  #FFD866
#   base4  #5B595C     green   #A9DC76
#   base5  #727072     blue    #78DCE8
#   base6  #939293     purple  #AB9DF2
#   base7  #C1C0C0
#   base8  #FCFCFA

# Status bar sits on base2 so it reads as slightly recessed from the panes.
set -g status-style 'bg=#221F22,fg=#939293'
set -g status-left-length 30
set -g status-right-length 60

# Session name badge in Monokai green
set -g status-left '#[bg=#A9DC76,fg=#221F22,bold] #S #[bg=#221F22,fg=#A9DC76,nobold]#[default]'
set -g status-right '#[fg=#727072]#{pane_current_command} #[fg=#403E41]│ #[fg=#78DCE8]%H:%M '

# Inactive tabs recede, active tab is yellow — Monokai's own highlight colour
setw -g window-status-format         '#[fg=#727072] #I #W#{?window_zoomed_flag, ,} '
setw -g window-status-current-format '#[bg=#403E41,fg=#FFD866,bold] #I #W#{?window_zoomed_flag, ,} #[default]'
setw -g window-status-bell-style     'fg=#FF6188,bold'
setw -g window-status-activity-style 'fg=#FC9867'
setw -g window-status-separator ''

set -g pane-border-style        'fg=#403E41'
set -g pane-active-border-style 'fg=#78DCE8'
set -g display-panes-colour        '#5B595C'
set -g display-panes-active-colour '#FFD866'

set -g message-style         'bg=#FFD866,fg=#221F22,bold'
set -g message-command-style 'bg=#403E41,fg=#FCFCFA'
set -g mode-style            'bg=#5B595C,fg=#FCFCFA'   # copy-mode selection
set -g copy-mode-match-style          'bg=#403E41,fg=#FFD866'
set -g copy-mode-current-match-style  'bg=#FFD866,fg=#221F22'

# ── Other Monokai Pro filters ────────────────────────────────
# To switch filters, replace the two background greys and the accents above.
#   Machine    bg #273136 / #1D2528   yellow #FFD866  green #A2E57B  blue #7CD5F1
#   Octagon    bg #282A3A / #1E1F2B   yellow #FFD76D  green #BAD761  blue #9CD1BB
#   Ristretto  bg #2C2525 / #211C1C   yellow #F9CC6C  green #ADDA78  blue #85DACC
#   Spectrum   bg #222222 / #191919   yellow #FCE566  green #7BD88F  blue #67D4F5
#   Classic    bg #272822 / #1D1E19   yellow #E6DB74  green #A6E22E  blue #66D9EF
